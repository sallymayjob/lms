services:
  postgres:
    image: postgres:15-alpine
    container_name: rwr-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lms-network

  n8n:
    image: n8nio/n8n:latest
    container_name: rwr-lms-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # N8N Core
      N8N_HOST: ${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Pacific/Auckland}

      # N8N Auth
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_SECURE_COOKIE: "false"
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_LOG_LEVEL: info

      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"

      # Slack
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_ADMIN_WEBHOOK_URL: ${SLACK_ADMIN_WEBHOOK_URL}
      LMS_ADMIN_CHANNEL: ${LMS_ADMIN_CHANNEL}

      # Google / Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_SHEETS_BACKUP_ID: ${GOOGLE_SHEETS_BACKUP_ID}
      LESSONS_SHEET_ID: ${LESSONS_SHEET_ID}
      ASSIGNMENT_DRIVE_WEBHOOK_URL: ${ASSIGNMENT_DRIVE_WEBHOOK_URL}

      # Content Factory
      PUBLISH_SECRET: ${PUBLISH_SECRET}
      NOTION_SYNC_ENABLED: ${NOTION_SYNC_ENABLED:-false}
      NOTION_LESSONS_DB_ID: ${NOTION_LESSONS_DB_ID:-}

      # N8N API (for entrypoint script)
      N8N_API_URL: http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    networks:
      - lms-network

  nginx:
    image: nginx:alpine
    container_name: rwr-lms-nginx
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - lms-network

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  lms-network:
    driver: bridge
